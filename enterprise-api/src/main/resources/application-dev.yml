spring:
  datasource:
    hikari:
      leak-detection-threshold: 20000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Swagger UI sends the XSRF-TOKEN cookie value as X-XSRF-TOKEN on "Try it out".
    csrf:
      enabled: true

app:
  security:
    cors:
      allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %5level [%15.15thread] [%X{correlationId:-}] %-40.40logger{39} : %msg%n%throwable"
  level:
    com.enterprise.api: DEBUG
