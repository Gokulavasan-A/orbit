spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    headers:
      hsts-enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.enterprise.api: INFO
